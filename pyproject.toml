[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "giotto-tda-cycles"
version = "0.1.0"
description = "Representative H1 cycle visualisation add-on for giotto-tda / gph-ripser"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
    "topological data analysis",
    "persistent homology",
    "representative cycles",
    "giotto-tda",
    "Vietoris-Rips",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "gph-ripser>=0.2.1",
    "giotto-tda>=0.6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.0",
]

[project.optional-dependencies]
# pandas powers RepresentativeCycles.to_dataframe() only; the rest of the
# package works without it, and its absence raises a clear ImportError.
dataframe = ["pandas>=2.0"]
dev = ["pytest>=7.0", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/sandythomas1/giotto-tda-cycles"
Issues   = "https://github.com/sandythomas1/giotto-tda-cycles/issues"

[tool.setuptools]
packages = ["repcycles", "repcycles.plotting"]
py-modules = ["representative_cycles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "perf: performance comparison tests (deselect with '-m \"not perf\"')",
    "scripts: runs the shipped example scripts end to end (deselect with '-m \"not scripts\"')",
]
